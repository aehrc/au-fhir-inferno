# TLS terminator so the validator-wrapper can use the LOCAL Ontoserver as its tx server.
# CONSTRAINT: org.hl7.fhir.core's tx client enforces TLS -- a plain http:// tx URL fails
# with "Unsupported or unrecognized SSL message". HL7 AU's real tx server is already
# https, so this is a local-rig artifact, not a deployment requirement. Without it arm A's
# tx would have to cross the WAN while arm B's is in-process, which is not a fair contrast.
events { worker_connections 1024; }
http {
  server {
    listen 8443 ssl;
    server_name tx-tls;
    ssl_certificate     /etc/nginx/tls/tx-tls.crt;
    ssl_certificate_key /etc/nginx/tls/tx-tls.key;
    client_max_body_size 256m;
    location / {
      proxy_pass http://onto:8080;
      proxy_set_header Host $host;
      proxy_read_timeout 600s;
    }
  }
}
